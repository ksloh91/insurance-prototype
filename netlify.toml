[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  NUXT_PUBLIC_FORMSPREE_ENDPOINT = "https://formspree.io/f/mdavlbyq"
  NUXT_PUBLIC_WHATSAPP_NUMBER = "60123456789"

# Enable Identity + Git Gateway in Netlify dashboard for /admin CMS access

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
